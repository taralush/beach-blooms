<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" aria-hidden="true">
  <!-- Beach Blooms illustration: arching phalaenopsis orchid spray (corner accent). Swap for custom art at the same path. -->
  <defs>
    <g id="o">
      <ellipse cx="0" cy="-19" rx="8.5" ry="18"/>
      <ellipse cx="0" cy="-18" rx="7.5" ry="17" transform="rotate(128)"/>
      <ellipse cx="0" cy="-18" rx="7.5" ry="17" transform="rotate(-128)"/>
      <ellipse cx="0" cy="-16" rx="16" ry="16.5" transform="rotate(74)"/>
      <ellipse cx="0" cy="-16" rx="16" ry="16.5" transform="rotate(-74)"/>
    </g>
    <g id="lip">
      <path d="M-7 3 Q-9 14 0 19 Q9 14 7 3 Q0 7 -7 3Z" fill="#C4516A" stroke="none"/>
      <circle cx="0" cy="-1" r="3.2" fill="#FFF3D6" stroke="none"/>
    </g>
  </defs>
  <g fill="none" stroke="#6E9A80" stroke-width="2.2" stroke-linecap="round">
    <path d="M60 318 Q48 200 96 128 Q138 66 214 46"/>
    <path d="M132 86 Q148 68 150 50"/>
  </g>
  <!-- buds -->
  <g fill="#F4C9D2" stroke="#C4516A" stroke-width="1.2">
    <ellipse cx="220" cy="44" rx="6" ry="8" transform="rotate(60 220 44)"/>
    <ellipse cx="206" cy="36" rx="5" ry="6.5" transform="rotate(20 206 36)"/>
    <ellipse cx="151" cy="46" rx="5" ry="7"/>
  </g>
  <!-- leaves at base -->
  <g fill="#8DB59C" stroke="#6E9A80" stroke-width="1.2">
    <path d="M60 318 Q10 300 4 262 Q40 270 62 306Z"/>
    <path d="M62 316 Q110 306 132 276 Q94 276 64 304Z"/>
  </g>
  <!-- blooms -->
  <g fill="#FBE6EA" stroke="#C4516A" stroke-width="1.4" stroke-linejoin="round">
    <use href="#o" transform="translate(84 170) scale(1.25) rotate(-8)"/>
    <use href="#o" transform="translate(118 108) scale(1.1) rotate(6)"/>
    <use href="#o" transform="translate(172 70) scale(.95) rotate(14)"/>
  </g>
  <use href="#lip" transform="translate(84 170) scale(1.25) rotate(-8)"/>
  <use href="#lip" transform="translate(118 108) scale(1.1) rotate(6)"/>
  <use href="#lip" transform="translate(172 70) scale(.95) rotate(14)"/>
  <!-- petal veins -->
  <g fill="none" stroke="#E7A5B3" stroke-width="1" stroke-linecap="round">
    <path d="M70 162 Q62 158 56 160"/><path d="M98 156 Q106 150 112 152"/>
    <path d="M106 102 Q100 98 94 100"/><path d="M130 98 Q138 94 142 96"/>
  </g>
</svg>
